# Copy to config.yaml and fill in. config.yaml is gitignored (keys live there).

# Roboflow key: leave empty — it's auto-read from .claude/settings.local.json
# (env.ROBOFLOW_API_KEY) or the ROBOFLOW_API_KEY environment variable.
roboflow_api_key: ""
# Trained model: project/version form (what the local `inference` package
# accepts). Maps to the dashboard's connect4-kewhf-1-rfdetr-small-t1 checkpoint.
model_id: "connect4-kewhf/1"

camera_index: 0
port: "/dev/cu.usbserial-310"

robot_color: red          # robot plays RED pieces (owner default)

gemini_api_key: ""        # empty -> canned trash talk only (still works offline)
commentary_model: "gemini-3.5-flash-lite"   # ~1s/line, fits the 3s budget

voice: say                # say | elevenlabs
elevenlabs_api_key: ""
elevenlabs_voice_id: ""

show_fps: true            # dev fps counter; set false for the final recording
